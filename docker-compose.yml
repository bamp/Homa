# Sobe o Homa localmente: aplicação + banco PostgreSQL
# Uso: cp .env.example .env && docker compose up --build

services:
  db:
    image: postgres:16-alpine
    container_name: homa-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - homa-db-data:/var/lib/postgresql/data   # dados persistem entre reinícios
    networks:
      - homa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: homa:local
    container_name: homa-app
    depends_on:
      db:
        condition: service_healthy   # só sobe depois que o banco está pronto
    environment:
      APP_ENV: ${APP_ENV}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DADOS_EXEMPLO: ${DADOS_EXEMPLO}
    ports:
      - "${APP_PORT}:8080"
    networks:
      - homa-net
    restart: unless-stopped

volumes:
  homa-db-data:

networks:
  homa-net:
    driver: bridge

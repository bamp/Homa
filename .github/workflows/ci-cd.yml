name: CI/CD Homa

# Fluxo de branches: feature/* -> develop -> main
#  - pull request (para develop ou main): build e testes, como portão do merge
#  - push na develop: build, testes, imagem no Docker Hub e deploy em STAGING
#  - push na main:    build, testes, imagem no Docker Hub e deploy em PRODUÇÃO,
#                     depois de aprovação manual (entrega contínua)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build-test:
    name: 1. Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compila e roda os testes (mvn verify)
        run: mvn -B verify

      - name: Resumo dos testes
        if: always()
        run: |
          echo "## Testes automatizados" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" target/surefire-reports/*.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guarda relatórios e o .jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homa-build
          path: |
            target/homa.jar
            target/surefire-reports/

  docker:
    name: 2. Imagem Docker
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Monta a imagem
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t homa:${{ github.sha }} .

      - name: Testa o container (sobe e checa o health)
        run: |
          docker run -d --name homa-smoke -p 8080:8080 -e APP_ENV=ci homa:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q UP; then
              echo "Container saudável"; curl -fsS http://localhost:8080/api/info; exit 0
            fi
            sleep 3
          done
          docker logs homa-smoke; exit 1

      - name: Login no Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publica a imagem (tag = SHA do commit)
        if: github.event_name == 'push'
        run: |
          IMAGE=index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/homa
          docker tag homa:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag homa:${{ github.sha }} $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.ref_name }}
          echo "## Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ secrets.DOCKERHUB_USERNAME }}/homa:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: 3. Deploy em staging
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Publica a imagem no Azure Web App de staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.STAGING_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PROFILE_STAGING }}
          images: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/homa:${{ github.sha }}
      - name: Confere se a nova versão está no ar
        run: bash scripts/aguardar-deploy.sh "${{ vars.STAGING_URL }}" "${{ github.sha }}"

  deploy-production:
    name: 4. Deploy em produção
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # O environment "production" exige aprovação manual (Settings > Environments > Required reviewers)
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Publica a imagem no Azure Web App de produção
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.PRODUCTION_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PROFILE_PRODUCTION }}
          images: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/homa:${{ github.sha }}
      - name: Confere se a nova versão está no ar
        run: bash scripts/aguardar-deploy.sh "${{ vars.PRODUCTION_URL }}" "${{ github.sha }}"
